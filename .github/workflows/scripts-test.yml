name: scripts-test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # 脚本要能在三种系统上跑：本项目的目标用户大量在 Windows，
      # 一个只在 Linux 通过的发布脚本等于没有脚本。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行单元测试
        run: python3 scripts/run_tests.py

      - name: 校验发布副本一致性
        run: python3 scripts/sync_snapshots.py --check

      - name: 检查文档写死数字
        run: python3 scripts/doc_lint.py

      - name: 校验技能包是否符合 Agent Skills 规范
        run: python3 scripts/validate_skills.py --verbose
