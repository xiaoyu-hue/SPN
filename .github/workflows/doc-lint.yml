name: doc-lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查发布副本与规范源是否一致
        # 这是全仓最重要的一道检查：技能包是用户真正加载的东西，
        # 一旦它与规范源漂移，用户拿到的规则就和仓库显示的不一样。
        # 修复命令会在失败时打印出来。
        run: python3 scripts/sync_snapshots.py --check

      - name: 检查文档是否写死会变化的数字
        run: |
          # 本仓库核心原则：会随代码变化的数字（测试数、版本号、条目数、模块数）
          # 不要手写进文档，否则一改代码就失真。
          # 由 scripts/doc_lint.py 统一实现（与历史 grep 版本相比，
          # 新增了容量/金额/CVE 编号等模式，且不再因为某行含「→」就整行豁免）。
          python3 scripts/doc_lint.py

      - name: 检查是否有时效性事实过期未复核
        # 非阻塞：过期提醒是"该去复核了"，不该为了它拦住一次合入。
        continue-on-error: true
        run: python3 scripts/check_facts.py
