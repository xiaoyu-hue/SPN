name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true   # 非阻塞：先观察有无误报，确认干净后去掉此行改为阻断
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
